name: Daily NBA Data Update

# This workflow is DISABLED because stats.nba.com blocks GitHub Actions IPs
# and the export pipeline requires local model files.
#
# Instead, the daily pipeline runs locally via launchd (06:00 TW):
#   bash scripts/daily_pipeline.sh
# which does: Get_Data → Get_Odds_Data → patch_scores → Create_Games →
#             export_predictions → git push → Vercel auto-deploys.
#
# To run manually: workflow_dispatch still works if you need to push
# already-exported JSON files from web/data/.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for changes
        run: |
          echo "This workflow only pushes pre-exported JSON."
          echo "Run scripts/daily_pipeline.sh locally first."
          ls -la web/data/ || echo "No data directory"
