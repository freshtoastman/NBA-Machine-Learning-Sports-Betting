name: Patch Final Scores

on:
  schedule:
    # 05:00 UTC = 13:00 台灣時間 (比賽結束後幾小時，補齊昨晚比分)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Cache SQLite
        uses: actions/cache@v4
        with:
          path: |
            Data/TeamData.sqlite
            Data/OddsData.sqlite
            Data/dataset.sqlite
          key: sqlite-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            sqlite-${{ runner.os }}-

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai python-dotenv

      - name: Patch scores
        run: python scripts/patch_scores.py

      - name: Rebuild dataset
        run: python src/Process-Data/Create_Games.py

      - name: Re-export predictions
        run: python scripts/export_predictions.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/
          if git diff --cached --quiet; then
            echo "No score changes."
          else
            git commit -m "patch scores $(date -u +%Y-%m-%d)

          Co-Authored-By: GitHub Actions <github-actions[bot]@users.noreply.github.com>"
            git push
          fi
